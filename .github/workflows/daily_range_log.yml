name: Daily Stock Range Log

on:
  schedule:
    # 매일 UTC 23:30 (= 한국시간 KST 다음 날 08:30)
    - cron: "30 23 * * *"
  workflow_dispatch: # GitHub Actions 화면에서 언제든 수동 실행 가능

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Run range tracker script
        run: python tracker.py

      - name: Commit and push updated CSV logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_range_logs/
          if git diff --staged --quiet; then
            echo "변경된 로그 파일이 없습니다."
          else
            git commit -m "chore: update daily stock range logs [skip ci]"
            git push
          fi
